name: EAS iOS Preview Build

on:
  push:

permissions:
  contents: read

jobs:
  build_preview_ios:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install

      - name: Ensure EAS project is configured
        run: |
          if ! node -e "const app=require('./app.json'); process.exit(app.expo?.extra?.eas?.projectId ? 0 : 1)"; then
            eas init --account semcitychris --non-interactive
          fi

      - name: Build iOS preview with EAS
        run: eas build --platform ios --profile preview --non-interactive
